<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width: 200px;
            margin: 20% auto;
            background-color: aqua;
            transition: all 2s;

        }
        .box:hover{
            transform: scale(2,3);
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
