<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PB 329</title>
    <style>
        .table{
            height: 200px;
            width: 50%;
            margin: 100px auto;
            font-size: 20px;
            text-align: center;
            background-color: bisque;
            border-collapse: collapse;
            transition: all 3s ease;

        }
        td{
            border: 2px solid black;
            padding: 10px;
        }
        .table:hover{
            width: 70%;
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>
    <table class="table">
    <tr><td>Apple</td><td>50</td><td>Yes</td></tr>
    <tr><td>Banana</td><td>20</td><td>No</td></tr>
    <tr><td>Mango</td><td>35</td><td>Yes</td></tr>
    <tr><td>Orange</td><td>40</td><td>No</td></tr>
    <tr><td>Grapes</td><td>60</td><td>Yes</td></tr>
</table>
</body>
</html>
